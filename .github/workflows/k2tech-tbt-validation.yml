name: K2 Tech TBT validation

on:
  push:
    branches:
      - agent/k2tech-invitation-intro
    paths:
      - .github/workflows/k2tech-tbt-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUDIT_URL: http://127.0.0.1:3000/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k2tech-invitation-intro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install lint and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Inspect initial client chunks
        run: |
          echo "Invitation string inside Next chunks:"
          grep -R -l "k2tech-invitation-opened" .next/static/chunks/*.js || true
          echo "Built JS chunks:"
          du -h .next/static/chunks/*.js | sort -h | tail -12
      - name: Start production server
        run: |
          npm start > /tmp/k2tech-next.log 2>&1 &
          echo $! > /tmp/k2tech-next.pid
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$AUDIT_URL" --output /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/k2tech-next.log
          exit 1
      - name: Run Lighthouse mobile with retry
        run: |
          success=0
          for attempt in 1 2 3; do
            rm -f ./lighthouse-mobile.json
            if npx --yes lighthouse "$AUDIT_URL" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=./lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile; then
              success=1
              break
            fi
            sleep 3
          done
          test "$success" -eq 1
      - name: Print TBT audit summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-mobile.json', 'utf8'));
          const c = report.categories;
          const a = report.audits;
          const pct = (key) => Math.round((c[key]?.score ?? 0) * 100);
          console.log(`performance=${pct('performance')}`);
          console.log(`accessibility=${pct('accessibility')}`);
          console.log(`best-practices=${pct('best-practices')}`);
          console.log(`seo=${pct('seo')}`);
          console.log(`FCP=${a['first-contentful-paint']?.displayValue ?? 'n/a'}`);
          console.log(`LCP=${a['largest-contentful-paint']?.displayValue ?? 'n/a'}`);
          console.log(`TBT=${a['total-blocking-time']?.displayValue ?? 'n/a'}`);
          console.log(`mainThread=${a['mainthread-work-breakdown']?.displayValue ?? 'n/a'}`);
          console.log(`bootup=${a['bootup-time']?.displayValue ?? 'n/a'}`);
          console.log(`longTasks=${a['long-tasks']?.displayValue ?? 'n/a'}`);
          for (const item of a['bootup-time']?.details?.items ?? []) console.log(`BOOT ${item.url} total=${Math.round(item.total)} scripting=${Math.round(item.scripting)}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: k2tech-tbt-report-native
          path: lighthouse-mobile.json
          retention-days: 3
      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/k2tech-next.pid)" || true
      - name: Remove temporary validation workflow
        if: success()
        run: |
          git config user.name "K2 Tech Quality Bot"
          git config user.email "105141966+andersonjhonatan@users.noreply.github.com"
          git rm .github/workflows/k2tech-tbt-validation.yml
          git commit -m "chore: finish native invitation TBT validation"
          git push origin agent/k2tech-invitation-intro

name: K2 Tech quality phase 2

on:
  push:
    branches:
      - agent/k2tech-invitation-intro
    paths:
      - .github/workflows/k2tech-quality-phase2.yml

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k2tech-invitation-intro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false sharp@0.34.3
      - name: Generate app icons and remove dead invitation CSS
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          (async () => {
            const source = 'public/favicons/k2-on-dark-v2.png';
            await sharp(source).resize(192, 192, { fit: 'contain' }).png({ compressionLevel: 9 }).toFile('public/favicons/k2-192.png');
            await sharp(source).resize(512, 512, { fit: 'contain' }).png({ compressionLevel: 9 }).toFile('public/favicons/k2-512.png');

            const logo = await sharp(source).resize(390, 390, { fit: 'contain' }).png().toBuffer();
            await sharp({
              create: { width: 512, height: 512, channels: 4, background: '#080b12' },
            }).composite([{ input: logo, gravity: 'center' }]).png({ compressionLevel: 9 }).toFile('public/favicons/k2-maskable-512.png');

            fs.writeFileSync('app/manifest.ts', `import type { MetadataRoute } from "next";\n\nexport default function manifest(): MetadataRoute.Manifest {\n  return {\n    name: "K2 Tech — Convites online interativos",\n    short_name: "K2 Tech",\n    description: "Convites online interativos e experiências digitais para momentos especiais.",\n    start_url: "/",\n    display: "standalone",\n    background_color: "#080b12",\n    theme_color: "#080b12",\n    lang: "pt-BR",\n    icons: [\n      { src: "/favicons/k2-192.png", sizes: "192x192", type: "image/png", purpose: "any" },\n      { src: "/favicons/k2-512.png", sizes: "512x512", type: "image/png", purpose: "any" },\n      { src: "/favicons/k2-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" },\n    ],\n  };\n}\n`);

            const cssPath = 'app/components/home/invitation-intro.css';
            let css = fs.readFileSync(cssPath, 'utf8');
            const deadRules = [
              /\.flap-curl\{[^}]*\}/g,
              /\.flap-segment\{[^}]*\}/g,
              /\.flap-face\{[^}]*\}/g,
              /\.flap-segment:nth-child\(6\) \.flap-face,\.flap-segment:nth-child\(7\) \.flap-face,\.flap-segment:nth-child\(8\) \.flap-face\{[^}]*\}/g,
              /\.is-opening \.flap-segment\{[^}]*\}/g,
            ];
            for (const rule of deadRules) css = css.replace(rule, '');
            fs.writeFileSync(cssPath, css);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Validate lint and production build
        run: |
          npm run lint
          npm run build
      - name: Commit validated cleanup
        run: |
          rm -f .github/workflows/k2tech-quality-phase2.yml
          git config user.name "K2 Tech Quality Bot"
          git config user.email "105141966+andersonjhonatan@users.noreply.github.com"
          git add -A
          git commit -m "improve manifest assets and remove dead invitation styles"
          git push origin agent/k2tech-invitation-intro

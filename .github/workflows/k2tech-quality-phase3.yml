name: K2 Tech quality phase 3

on:
  push:
    branches:
      - agent/k2tech-invitation-intro
    paths:
      - .github/workflows/k2tech-quality-phase3.yml

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k2tech-invitation-intro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply accessibility CSS refinements
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'app/globals.css';
          let css = fs.readFileSync(file, 'utf8');
          css = css.split('.device-content h3').join('.device-title');
          css = css.replace(
            '.service-number{font:600 10px var(--font-inter),Arial,sans-serif;color:var(--blue)}',
            '.service-number{font:700 10px var(--font-inter),Arial,sans-serif;color:#fff;background:var(--blue);padding:4px 6px;border-radius:2px;width:max-content}'
          );
          css = css.replace(
            '.footer small{font:400 9px var(--font-inter),Arial,sans-serif;letter-spacing:.04em;color:#777571}',
            '.footer small{font:400 9px var(--font-inter),Arial,sans-serif;letter-spacing:.04em;color:#96938e}'
          );
          if (!css.includes('button:focus-visible,input:focus-visible')) {
            css += '\na:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #5574ff;outline-offset:3px}\n';
          }
          fs.writeFileSync(file, css);
          NODE
      - name: Validate lint and production build
        run: |
          npm run lint
          npm run build
      - name: Commit validated accessibility refinements
        run: |
          rm -f .github/workflows/k2tech-quality-phase3.yml
          git config user.name "K2 Tech Quality Bot"
          git config user.email "105141966+andersonjhonatan@users.noreply.github.com"
          git add -A
          git commit -m "refine contrast focus and invitation semantics"
          git push origin agent/k2tech-invitation-intro

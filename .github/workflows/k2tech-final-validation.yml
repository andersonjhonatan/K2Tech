name: K2 Tech final quality validation

on:
  push:
    branches:
      - agent/k2tech-invitation-intro
    paths:
      - .github/workflows/k2tech-final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AUDIT_URL: http://127.0.0.1:3000/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k2tech-invitation-intro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install lint and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Start production server
        run: |
          npm start > /tmp/k2tech-next.log 2>&1 &
          echo $! > /tmp/k2tech-next.pid
      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$AUDIT_URL" --output /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/k2tech-next.log
          exit 1
      - name: Run Lighthouse mobile
        run: npx --yes lighthouse "$AUDIT_URL" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=./lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile
      - name: Run Lighthouse desktop
        run: npx --yes lighthouse "$AUDIT_URL" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=./lighthouse-desktop.json --only-categories=performance,accessibility,best-practices,seo --preset=desktop
      - name: Print final audit summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const mode of ['mobile','desktop']) {
            const report = JSON.parse(fs.readFileSync(`lighthouse-${mode}.json`, 'utf8'));
            const c = report.categories;
            const a = report.audits;
            const pct = (key) => Math.round((c[key]?.score ?? 0) * 100);
            console.log(`FINAL LIGHTHOUSE ${mode.toUpperCase()}`);
            console.log(`performance=${pct('performance')}`);
            console.log(`accessibility=${pct('accessibility')}`);
            console.log(`best-practices=${pct('best-practices')}`);
            console.log(`seo=${pct('seo')}`);
            console.log(`FCP=${a['first-contentful-paint']?.displayValue ?? 'n/a'}`);
            console.log(`LCP=${a['largest-contentful-paint']?.displayValue ?? 'n/a'}`);
            console.log(`TBT=${a['total-blocking-time']?.displayValue ?? 'n/a'}`);
            console.log(`CLS=${a['cumulative-layout-shift']?.displayValue ?? 'n/a'}`);
            console.log(`SpeedIndex=${a['speed-index']?.displayValue ?? 'n/a'}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: k2tech-final-lighthouse
          path: lighthouse-*.json
          retention-days: 7
      - name: Stop production server
        if: always()
        run: kill "$(cat /tmp/k2tech-next.pid)" || true
      - name: Remove temporary validation workflow
        if: success()
        run: |
          rm -f .github/workflows/k2tech-final-validation.yml
          git config user.name "K2 Tech Quality Bot"
          git config user.email "105141966+andersonjhonatan@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize validated quality pass"
          git push origin agent/k2tech-invitation-intro

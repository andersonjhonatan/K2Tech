<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 900px at 75% 55%,#1d4ed8 0%,#0b1640 45%,#05070f 80%);font-family:'Poppins'}
/* raios de fundo */
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 75% 55%,rgba(255,255,255,.05) 0deg 8deg,rgba(255,255,255,0) 8deg 20deg)}
.top{position:absolute;left:60px;right:60px;top:270px;text-align:left}
.badge{display:inline-block;background:#FFD400;color:#0B0B0C;font-weight:800;font-size:54px;padding:6px 30px;border-radius:14px;transform:rotate(-3deg);box-shadow:0 10px 0 #b38f00}
.h{margin-top:30px;font-weight:800;font-size:128px;line-height:.95;color:#FFFFFF;letter-spacing:-.03em;text-transform:uppercase;
   text-shadow:0 8px 0 #0B0B0C,6px 0 0 #0B0B0C,-6px 0 0 #0B0B0C,0 -6px 0 #0B0B0C,0 18px 30px rgba(0,0,0,.6)}
.h .y{color:#FFD400}
/* lado esquerdo: caderninho riscado */
.note{position:absolute;left:40px;top:930px;width:440px;height:440px;font-size:330px;line-height:440px;text-align:center;transform:rotate(-10deg);filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.x{position:absolute;left:60px;top:960px;width:400px;height:400px}
.x:before,.x:after{content:"";position:absolute;left:-10px;top:180px;width:420px;height:44px;background:#EF2B2B;border-radius:22px;box-shadow:0 0 0 8px #0B0B0C}
.x:before{transform:rotate(45deg)}.x:after{transform:rotate(-45deg)}
/* lado direito: celular com sistema */
.phone{position:absolute;right:60px;top:860px;width:400px;border-radius:52px;padding:14px;background:#111;box-shadow:0 0 0 6px #FFD400,0 30px 60px rgba(0,0,0,.7);transform:rotate(6deg)}
.phone img{display:block;width:100%;border-radius:40px}
.ok{position:absolute;right:30px;top:820px;width:150px;height:150px;border-radius:50%;background:#16A34A;border:8px solid #0B0B0C;color:#fff;font-size:100px;font-weight:800;display:flex;align-items:center;justify-content:center;transform:rotate(8deg)}
/* seta */
.arrow{position:absolute;left:400px;top:1080px;width:240px;height:120px}
.bottom{position:absolute;left:60px;right:60px;top:1470px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#EF2B2B;color:#fff;font-weight:800;font-size:46px;padding:14px 30px;border-radius:16px;border:6px solid #0B0B0C;transform:rotate(-2deg)}
.mark{height:110px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
</style></head><body>
<div class="c" id="capa">
 <div class="rays"></div>
 <div class="top">
  <span class="badge">3 SINAIS</span>
  <div class="h">Ainda no<br><span class="y">caderninho?</span></div>
 </div>
 <div class="note">📒</div>
 <div class="x"></div>
 <svg class="arrow" viewBox="0 0 240 120"><path d="M10 60 H170" stroke="#0B0B0C" stroke-width="44" stroke-linecap="round"/><path d="M150 15 L225 60 L150 105 Z" fill="#0B0B0C" stroke="#0B0B0C" stroke-width="14" stroke-linejoin="round"/><path d="M10 60 H170" stroke="#FFD400" stroke-width="28" stroke-linecap="round"/><path d="M155 28 L212 60 L155 92 Z" fill="#FFD400"/></svg>
 <div class="phone"><img src="../kort-telas/faturamento.png"></div>
 <div class="ok">✓</div>
 <div class="bottom"><span class="pill">SEU COMÉRCIO PRECISA DISSO</span></div><img class="mark" src="../mark.png" style="position:absolute;right:60px;top:262px">
</div>
</body></html>

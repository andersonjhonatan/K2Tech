<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Caveat';src:url(../fonts/caveat-latin-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Poppins';
  background:radial-gradient(700px 600px at 50% 62%,rgba(59,130,246,.45),rgba(59,130,246,0) 70%),linear-gradient(180deg,#0a1230 0%,#081026 55%,#05070f 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px}
.vig{position:absolute;inset:0;background:radial-gradient(1200px 1300px at 50% 55%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
.mark{position:absolute;right:64px;top:270px;height:96px}
.title{position:absolute;left:64px;right:64px;top:290px}
.t1,.t2{font-weight:800;text-transform:uppercase;letter-spacing:-.025em;line-height:.95;color:#fff;
  text-shadow:0 6px 0 #02040b,0 0 0 #000,0 22px 40px rgba(0,0,0,.55)}
.t1{font-size:118px}
.t1 s{text-decoration:none;position:relative}
.t1 s:after{content:"";position:absolute;left:-10px;right:-10px;top:52%;height:16px;background:#EF2B2B;border-radius:8px;transform:rotate(-4deg);box-shadow:0 4px 0 #02040b}
.t2{font-size:132px;margin-top:6px}
.t2 b{color:#FFD400}
/* caderno */
.paper{position:absolute;left:70px;top:760px;width:460px;height:600px;border-radius:14px;transform:rotate(-7deg);
  background:repeating-linear-gradient(180deg,#FFFBEF 0px,#FFFBEF 58px,#9EC3EE 58px,#9EC3EE 60px);box-shadow:0 30px 60px rgba(0,0,0,.6);padding:70px 30px 0 92px;font-family:'Caveat';color:#22304f;font-size:50px;line-height:60px}
.paper:before{content:"";position:absolute;left:66px;top:0;bottom:0;width:4px;background:#F28B8B}
.paper .r{color:#C62828}
.paper .stain{position:absolute;right:34px;bottom:50px;width:120px;height:120px;border-radius:50%;border:10px solid rgba(140,90,40,.25)}
.rings{position:absolute;left:-18px;top:30px;display:flex;flex-direction:column;gap:46px}
.rings i{display:block;width:44px;height:20px;border-radius:10px;background:#9aa3b5;box-shadow:inset 0 -4px 0 #6b7385}
/* celular */
.phone{position:absolute;right:66px;top:700px;width:420px;border-radius:56px;padding:14px;background:#0d0d10;transform:rotate(6deg);
  box-shadow:0 0 0 3px #2c2c31,0 40px 80px rgba(0,0,0,.7),0 0 120px 30px rgba(59,130,246,.35)}
.phone img{display:block;width:100%;border-radius:44px}
/* etiquetas */
.lab{position:absolute;font-weight:800;font-size:52px;color:#fff;padding:10px 28px;border-radius:16px;border:6px solid #02040b;box-shadow:0 8px 0 #02040b}
.antes{left:110px;top:700px;background:#EF2B2B;transform:rotate(-8deg)}
.depois{right:90px;top:640px;background:#16A34A;transform:rotate(6deg)}
.arrow{position:absolute;left:470px;top:1060px;width:170px;height:100px}
.bottom{position:absolute;left:0;right:0;top:1520px;display:flex;justify-content:center}
.badge{background:#FFD400;color:#0B0B0C;font-weight:800;font-size:50px;padding:14px 36px;border-radius:18px;border:6px solid #02040b;box-shadow:0 10px 0 #02040b;transform:rotate(-2deg)}
</style></head><body>
<div class="c" id="capa">
 <div class="grid"></div>
 <img class="mark" src="../mark.png">
 <div class="title">
  <div class="t1"><s>Caderninho</s></div>
  <div class="t2">ou <b>sistema?</b></div>
 </div>
 <div class="paper">
  <div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  Fiado Zé - 30,00<br>
  <span class="r">Maria ??? pagou?</span><br>
  Bodies P - acabou?<br>
  caixa: 1.2?? <span class="r">✗</span><br>
  ver estoque lá dentro<br>
  Joana 3x... ??
  <div class="stain"></div>
 </div>
 <div class="phone"><img src="../kort-telas/faturamento.png"></div>
 <div class="lab antes">ANTES</div>
 <div class="lab depois">DEPOIS</div>
 <svg class="arrow" viewBox="0 0 170 100"><path d="M8 50 H110" stroke="#02040b" stroke-width="40" stroke-linecap="round"/><path d="M95 8 L162 50 L95 92 Z" fill="#02040b" stroke="#02040b" stroke-width="12" stroke-linejoin="round"/><path d="M8 50 H112" stroke="#FFD400" stroke-width="24" stroke-linecap="round"/><path d="M100 20 L150 50 L100 80 Z" fill="#FFD400"/></svg>
 <div class="bottom"><span class="badge">3 SINAIS PARA MUDAR JÁ</span></div>
 <div class="vig"></div>
</div>
</body></html>

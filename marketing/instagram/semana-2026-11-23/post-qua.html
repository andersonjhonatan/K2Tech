<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Caveat;src:url(caveat-latin-700-normal.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0B0B0C;font-family:'Inter';color:#F5F5F7}
.s:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 45%,#1a2f6b 0%,rgba(11,11,12,0) 65%)}
.top{position:absolute;left:88px;right:88px;top:80px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.mark{height:92px}.tag{font-size:24px;letter-spacing:.18em;color:#C8A96A;font-weight:700}
.note{position:absolute;left:150px;top:260px;width:780px;height:760px;background:#FDE68A;transform:rotate(-3deg);
 box-shadow:0 50px 90px rgba(0,0,0,.6),inset 0 -30px 60px rgba(180,130,0,.12);padding:90px 70px;color:#1f2937}
.note:before{content:"";position:absolute;top:-34px;left:50%;transform:translateX(-50%) rotate(2deg);width:260px;height:70px;background:rgba(245,245,247,.55)}
.note .q{font-family:Caveat;font-weight:700;font-size:118px;line-height:1.02}
.note .q u{text-decoration:none;background:linear-gradient(transparent 62%,rgba(37,99,235,.0) 62%,rgba(37,99,235,0) 86%,#2563EB 86%,#2563EB 93%,transparent 93%)}
.note .sig{position:absolute;right:70px;bottom:60px;font-family:Caveat;font-size:54px;color:#6b5a1e}
.bottom{position:absolute;left:88px;right:88px;bottom:80px;z-index:3}
.bottom h2{font-family:'Poppins';font-size:54px;line-height:1.1}
.bottom h2 b{color:#3B82F6}
.bottom p{margin-top:12px;font-size:28px;color:#9a9ba3}
</style></head><body>
<div class="s">
 <div class="top"><img class="mark" src="mark.png"><span class="tag">QUEM NUNCA?</span></div>
 <div class="note"><div class="q">"Anota aí<br>no caderno que<br><u>sexta eu passo</u><br>pra pagar."</div><div class="sig">— todo cliente, toda semana</div></div>
 <div class="bottom"><h2>E a sexta <b>nunca chega</b>. 😅</h2><p>Marca aquele amigo comerciante · @tresktecnologia</p></div>
</div></body></html>

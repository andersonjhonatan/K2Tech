<html><head><style>

 background:radial-gradient(800px 500px at 50% 40%,#8a4a22,#4a220d 75%)}
.cloth{position:absolute;left:-100px;right:-100px;bottom:-140px;height:520px;transform:perspective(900px) rotateX(55deg);

.plate{position:absolute;left:50%;top:56%;width:860px;height:420px;margin-left:-430px;border-radius:50%;background:radial-gradient(#fffaf2,#e9dcc6);box-shadow:0 40px 60px rgba(0,0,0,.45)}
.f img{position:absolute}
</style></head><body>
<div class="f" id="coxinha"><div class="cloth"></div><div class="plate"></div><img src="coxinha.png" style="width:420px;left:250px;top:300px"><img src="coxinha.png" style="width:380px;left:560px;top:330px;transform:rotate(14deg)"></div>
<div class="f" id="pastel"><div class="cloth"></div><div class="plate"></div><img src="pastel.png" style="width:760px;left:220px;top:150px"></div>
<div class="f" id="kibe"><div class="cloth"></div><div class="plate"></div><img src="kibe.png" style="width:520px;left:190px;top:300px;transform:rotate(-8deg)"><img src="kibe.png" style="width:480px;left:520px;top:330px;transform:rotate(10deg)"></div>
<div class="f" id="empada"><div class="cloth"></div><div class="plate"></div><img src="empada.png" style="width:520px;left:340px;top:250px"></div>
<div class="f" id="refri"><div class="cloth"></div><div class="plate" style="opacity:0"></div><img src="refri.png" style="width:560px;left:320px;top:200px"></div>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter;background:#0b141a}
.top{position:absolute;left:0;right:0;top:0;height:250px;background:#1f2c34;display:flex;align-items:flex-end;gap:26px;padding:0 40px 34px;z-index:5;color:#e9edef}
.av{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#C8A96A,#8C6F3A);display:grid;place-items:center;font-family:Poppins;font-weight:700;font-size:46px;color:#0b0b0c;flex:none}
.nm{font-weight:700;font-size:44px}.stt{font-size:30px;color:#8696a0;margin-top:2px}
.wall{position:absolute;left:0;right:0;top:250px;bottom:170px;overflow:hidden;background:#0b141a;background-image:radial-gradient(rgba(255,255,255,.035) 2px,transparent 2px);background-size:46px 46px}
#col{position:absolute;left:0;right:0;top:0;padding:40px 34px;display:flex;flex-direction:column;gap:18px}
.m{max-width:780px;padding:20px 26px 14px;border-radius:26px;font-size:42px;line-height:1.3;color:#e9edef;position:relative;box-shadow:0 2px 2px rgba(0,0,0,.2)}
.m .h{display:block;text-align:right;font-size:24px;color:rgba(233,237,239,.6);margin-top:4px}
.R{align-self:flex-end;background:#005c4b;border-top-right-radius:6px}
.J{align-self:flex-start;background:#202c33;border-top-left-radius:6px}
.m.img{padding:10px;width:560px}
.m.img .pic{height:860px;border-radius:20px;overflow:hidden;position:relative}
.m.link .card{background:#111b21;border-radius:16px;padding:20px 22px;margin-bottom:12px;display:flex;gap:18px;align-items:center;font-size:30px}
.typing{align-self:flex-start;background:#202c33;border-radius:26px;border-top-left-radius:6px;padding:26px 30px;display:flex;gap:10px}
.typing i{width:16px;height:16px;border-radius:50%;background:#8696a0}
.bot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#0b141a;display:flex;align-items:center;gap:20px;padding:0 30px;z-index:5}
.inp{flex:1;height:100px;border-radius:50px;background:#202c33;color:#8696a0;font-size:34px;display:flex;align-items:center;padding:0 40px}
.mic{width:100px;height:100px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-size:44px}
.endc{position:absolute;inset:0;opacity:0;z-index:20;background:radial-gradient(90% 60% at 50% 100%,rgba(241,221,174,.4),rgba(200,169,106,.08) 50%,transparent 75%),#0B0B0C;color:#F5F5F7}
.gold{background:linear-gradient(100deg,#F1DDAE,#C8A96A 45%,#8C6F3A);-webkit-background-clip:text;background-clip:text;color:transparent}
.h1{position:absolute;left:80px;right:80px;text-align:center;font-family:Poppins;font-weight:700;letter-spacing:-.03em;line-height:1.05}
</style></head><body><div id="st">
<div class="top"><div class="av">J</div><div><div class="nm">Joana · loja do lado</div><div class="stt" id="stt">online</div></div></div>
<div class="wall"><div id="col"></div></div>
<div class="bot"><div class="inp">Mensagem</div><div class="mic">🎤</div></div>
<div class="endc" id="end">
 <div id="tagE" style="position:absolute;left:50%;top:430px;margin-left:-150px;filter:drop-shadow(0 20px 60px rgba(200,169,106,.5))"></div>
 <div class="h1" id="wE" style="top:770px;font-size:190px;letter-spacing:.08em">K<span class="gold">LOJA</span></div>
 <div class="h1" id="tE" style="top:1010px;font-size:64px;font-weight:600">A sua loja inteira<br>num sistema só.</div>
 <div id="cE" style="position:absolute;left:150px;right:150px;top:1270px;text-align:center;padding:34px;border-radius:30px;background:linear-gradient(135deg,#F1DDAE,#C8A96A 55%,#8C6F3A);color:#0b0b0c"><div style="font-family:Poppins;font-weight:700;font-size:54px">10 dias grátis</div><div style="font-size:34px;font-weight:600;margin-top:6px">tresktecnologia.com.br/kloja</div></div>
 <div id="bE" style="position:absolute;left:0;right:0;top:1530px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:32px;color:#a3a3ad"><img src="mark.png" style="height:80px"> Desenvolvido pela TresK Tecnologia</div>
</div>
</div>
<script src="common.js"></script><script src="screens.js"></script>
<script>
const MSG=[
 [0.6,'R','Joana, tu tá aí? 😩'],
 [2.2,'R','Perdi o caderno do fiado DE NOVO'],
 [4.6,'J','Caderno? Mulher, eu aposentei o meu 😂'],
 [7.4,'R','Aposentou como?? E quem te deve?'],
 [10.0,'J','Tá tudo aqui no KLOJA, ó 👇'],
 [11.6,'J','IMG:CRED'],
 [15.4,'R','E as clientes, como ficam sabendo?'],
 [17.8,'J','Elas têm o app Meu Crediário, com o nome da minha loja'],
 [19.8,'J','IMG:MC'],
 [23.4,'J','Veem a parcela e pagam no Pix. Caiu, já fica pago aqui ✅'],
 [26.8,'R','Sem eu ter que ficar cobrando?! 😳'],
 [29.0,'R','E o estoque? Eu nunca sei se tem o M'],
 [31.4,'J','Vendeu no caixa, baixa sozinho'],
 [33.4,'J','LINK:E as clientes veem as peças no meu catálogo, pelo link 🛍️'],
 [37.2,'R','Hum… isso deve ser caro 🤔'],
 [39.6,'J','Que nada! Dá pra testar 10 dias grátis'],
 [41.8,'J','E quem fez foi a TresK, aqui do Sertão 💙'],
 [44.6,'R','Pois amanhã eu fecho o caderno… e abro o KLOJA! 🙌'],
 [47.4,'J','Bem-vinda ao clube 😎'],
];
const END_AT=50.2; window.TOTAL=57;
const col=$('col'); const H=1920-250-170-40;
const hh=(i)=>`<span class="h">18:${String(20+Math.floor(MSG[i][0]/6)).padStart(2,'0')}${MSG[i][1]==='R'?' ✓✓':''}</span>`;
MSG.forEach((m,i)=>{const d=document.createElement('div'); let tx=m[2];
 if(tx.startsWith('IMG:')){d.className='m img '+m[1]; d.innerHTML=`<div class="pic">${tx==='IMG:CRED'?SCR_CRED:SCR_MC}</div>${hh(i)}`;}
 else if(tx.startsWith('LINK:')){d.className='m link '+m[1]; d.innerHTML=`<div class="card"><div style="width:90px;height:90px;flex:none">${TAG(90,'lk'+i)}</div><div><b style="color:#e9edef">Catálogo · Joana Modas</b><div style="color:#8696a0;font-size:26px">sualoja.kloja</div></div></div>${tx.slice(5)}${hh(i)}`;}
 else {d.className='m '+m[1]; d.innerHTML=tx+hh(i);}
 d.id='m'+i; col.appendChild(d);});
const ty=document.createElement('div'); ty.className='typing'; ty.innerHTML='<i></i><i></i><i></i>'; col.appendChild(ty);
const tops=MSG.map((_,i)=>{const e=$('m'+i);return e.offsetTop+e.offsetHeight;});
$('tagE').innerHTML=TAG(300,'gE');
function render(t){
 let k=-1; MSG.forEach((m,i)=>{const e=$('m'+i); const a=m[0]; if(t>=a){k=i; e.style.display='';const p=back((t-a)/.35); e.style.opacity=cl((t-a)/.15); e.style.transform=`scale(${.85+.15*p})`; e.style.transformOrigin=m[1]==='R'?'right top':'left top';} else e.style.display='none';});
 // digitando (antes das mensagens da Joana)
 const nx=MSG[k+1]; const typing = nx && nx[1]==='J' && t>=nx[0]-1.1;
 ty.style.display=typing?'flex':'none'; $('stt').textContent=typing?'digitando…':'online'; $('stt').style.color=typing?'#00a884':'#8696a0';
 if(typing) ty.querySelectorAll('i').forEach((d,j)=>d.style.opacity=.4+.6*Math.max(0,Math.sin(t*9-j*.8)));
 // rolagem
 const tgt=i=>{ if(i<0) return 0; const e=$('m'+i); return Math.max(0,e.offsetTop+e.offsetHeight-H); };
 // rolagem: recomputa com as mensagens visíveis
 let y=0; if(k>=0){ const prev=tgt(k-1), cur=tgt(k); y=prev+(cur-prev)*eio((t-MSG[k][0])/.35); if(typing) y=Math.max(y, cur+ (ty.offsetHeight+18)*eio((t-(nx[0]-1.1))/.3)); }
 col.style.transform=`translateY(${-y}px)`;
 const e=$('end'); const ke=ease((t-END_AT)/.6); e.style.opacity=ke; const ln=t-END_AT;
 if(ln>0){ $('tagE').style.transform=`scale(${back(ln/.7)}) rotate(${(1-ease(ln/.8))*-30}deg)`; $('wE').style.opacity=ease((ln-.5)/.6); $('tE').style.opacity=ease((ln-1.3)/.6); $('cE').style.opacity=ease((ln-2.1)/.5); $('cE').style.transform=`scale(${back((ln-2.1)/.5)})`; $('bE').style.opacity=ease((ln-2.9)/.6); }
 $('st').style.filter=`brightness(${1-cl(1-t/.4)})`;
}
window.render=render; render(0);
</script></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter;color:#1E2A38}
svg.full{position:absolute;inset:0}
.bub{position:absolute;max-width:760px;background:#fff;border-radius:44px;padding:30px 40px;font-family:Inter;font-weight:700;font-size:46px;line-height:1.25;color:#1E2A38;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:10}
.bub small{display:block;font-size:24px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.bub.R small{color:#E0607E}.bub.J small{color:#8C6F3A}
.bub.J{background:#FFF8EA;border:4px solid #C8A96A}
.bub::after{content:"";position:absolute;bottom:-34px;width:0;height:0;border:22px solid transparent;border-top:24px solid #fff}
.bub.R::after{left:110px}.bub.J::after{right:110px;border-top-color:#C8A96A}
.phoneP{position:absolute;left:290px;top:300px;width:500px;height:1000px;border-radius:66px;background:#050506;padding:16px;box-shadow:0 0 0 8px #18181c,0 50px 120px rgba(0,0,0,.6),0 0 140px rgba(241,221,174,.35);z-index:8;opacity:0}
.phoneP .scr{width:100%;height:100%;border-radius:52px;overflow:hidden;position:relative}
.sign{position:absolute;font-family:Poppins;font-weight:700;font-size:40px;padding:14px 26px;border-radius:14px}
.endc{position:absolute;inset:0;opacity:0;z-index:30;background:radial-gradient(90% 60% at 50% 100%,rgba(241,221,174,.4),rgba(200,169,106,.08) 50%,transparent 75%),#0B0B0C;color:#F5F5F7}
.gold{background:linear-gradient(100deg,#F1DDAE,#C8A96A 45%,#8C6F3A);-webkit-background-clip:text;background-clip:text;color:transparent}
.h1{position:absolute;left:80px;right:80px;text-align:center;font-family:Poppins;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.title{position:absolute;left:0;right:0;top:170px;text-align:center;font-family:Poppins;font-weight:700;font-size:56px;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.4);z-index:9}
</style></head><body><div id="st">
<svg class="full" viewBox="0 0 1080 1920">
 <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2350"/><stop offset=".45" stop-color="#C8506A"/><stop offset=".75" stop-color="#F59E5B"/><stop offset="1" stop-color="#FCD38D"/></linearGradient></defs>
 <rect width="1080" height="1920" fill="url(#sky)"/>
 <circle id="sun" cx="540" cy="900" r="150" fill="#FFE3A3" opacity=".9"/>
 <!-- lojas -->
 <g id="shopL"><rect x="0" y="700" width="540" height="900" fill="#E8D6C0"/><rect x="0" y="680" width="540" height="40" fill="#B98F6A"/>
  <rect x="50" y="900" width="440" height="560" fill="#3A3540"/><g id="doorL"></g>
</g>
 <g id="shopR"><rect x="540" y="700" width="540" height="900" fill="#F1E3CF"/><rect x="540" y="680" width="540" height="40" fill="#C8A96A"/>
  <rect x="590" y="900" width="440" height="560" fill="#FFE9B8"/><g id="doorR"></g></g>
 <rect x="0" y="1600" width="1080" height="320" fill="#6B5B57"/><rect x="0" y="1590" width="1080" height="20" fill="#857470"/>
 <g id="rita"></g><g id="joana"></g>
</svg>
<div class="sign" style="left:110px;top:760px;background:#fff;color:#7A3B2E">Loja da Rita</div>
<div class="sign" style="left:640px;top:760px;background:#0B0B0C;color:#F1DDAE;display:flex;gap:12px;align-items:center"><span id="signTag"></span>Joana Modas</div>
<div class="title" id="ttl"></div>
<div class="phoneP" id="ph"><div class="scr" id="phs"></div></div>
<div class="bub" id="bub"></div>
<div class="endc" id="end">
 <div id="tagE" style="position:absolute;left:50%;top:430px;margin-left:-150px;filter:drop-shadow(0 20px 60px rgba(200,169,106,.5))"></div>
 <div class="h1" id="wE" style="top:770px;font-size:190px;letter-spacing:.08em">K<span class="gold">LOJA</span></div>
 <div class="h1" id="tE" style="top:1010px;font-size:64px;font-weight:600">A sua loja inteira<br>num sistema só.</div>
 <div id="cE" style="position:absolute;left:150px;right:150px;top:1270px;text-align:center;padding:34px;border-radius:30px;background:linear-gradient(135deg,#F1DDAE,#C8A96A 55%,#8C6F3A);color:#0b0b0c"><div style="font-family:Poppins;font-weight:700;font-size:54px">10 dias grátis</div><div style="font-size:34px;font-weight:600;margin-top:6px">tresktecnologia.com.br/kloja</div></div>
 <div id="bE" style="position:absolute;left:0;right:0;top:1530px;display:flex;justify-content:center;align-items:center;gap:22px;font-size:32px;color:#a3a3ad"><img src="mark.png" style="height:80px"> Desenvolvido pela TresK Tecnologia</div>
</div>
</div>
<script src="common.js"></script><script src="screens.js"></script><script src="v3-tempos.js"></script>
<script>
const LINES=[
 ['R','Ai, Joana… mais um dia procurando o caderno do fiado. Sumiu de novo!'],
 ['J','Caderno? Mulher, eu aposentei o meu.'],
 ['R','Aposentou como? E quem te deve?'],
 ['J','Tá tudo aqui, ó. No KLOJA: cada cliente, cada parcela, quem pagou e quem tá atrasada.','CRED'],
 ['R','E as clientes, como é que ficam sabendo?'],
 ['J','Elas têm o app Meu Crediário, com o nome da minha loja. Veem a parcela e pagam no Pix.','MC'],
 ['R','Sem eu ter que ficar cobrando?!'],
 ['R','E o estoque? Eu nunca sei se tem o M.'],
 ['J','Vendeu no caixa, baixa sozinho. E as clientes veem as peças no meu catálogo, pelo link.','CAT'],
 ['R','Hum… isso deve ser caro.'],
 ['J','Que nada! Dá pra testar dez dias grátis. E quem fez foi a TresK, aqui do Sertão.'],
 ['R','Pois amanhã eu fecho o caderno… e abro o KLOJA!'],
 ['J','Bem-vinda ao clube!'],
];
let t0=1.2; const TL=LINES.map(l=>{const d=Math.max(2.0,l[1].length/16+0.6); const o={who:l[0],txt:l[1],scr:l[2]||null,s:t0,e:t0+d}; t0+=d+0.45; return o;});
let END_AT=t0+0.3; window.TOTAL=END_AT+6.5;
if(window.VOZ){ TL.forEach((l,i)=>{l.s=VOZ[i][0]; l.e=VOZ[i][1];}); END_AT=VOZ[TL.length][0]-0.4; window.TOTAL=VOZ[TL.length][1]+2.6; }
window.TL=TL;
const RITA={skin:'#C98B62',hair:'#3A2418',style:'long',shirt:'#E0607E',pants:'#3A3F58'};
const JOANA={skin:'#8D5A3B',hair:'#1E1410',style:'bun',shirt:'#C8A96A',pants:'#2E3A4A'};
place('rita',person({...RITA,id:'pr'}),300,1700,1.25);
place('joana',person({...JOANA,id:'pj'}),790,1700,1.25);
document.querySelector('#pj .armR .prop').innerHTML='<rect x="-34" y="118" width="62" height="108" rx="12" fill="#111318"/><rect x="-29" y="124" width="52" height="96" rx="8" fill="#F1DDAE" class="scrn"/>';
$('signTag').innerHTML=TAG(50,'sg'); $('tagE').innerHTML=TAG(300,'gE');
// porta de enrolar meio fechada (fim de tarde)
const door=(x)=>[...Array(14)].map((_,i)=>`<rect x="${x}" y="${900+i*20}" width="440" height="16" fill="${i%2?'#8D8A92':'#A7A4AB'}"/>`).join('');
$('doorL').innerHTML=door(50); $('doorR').innerHTML=door(590);
const SCR={CRED:SCR_CRED,MC:SCR_MC,CAT:SCR_CAT};
const TIT={CRED:'Crediário no KLOJA',MC:'App Meu Crediário',CAT:'Catálogo online'};
function render(t){
 const cur=TL.find(l=>t>=l.s-.15&&t<l.e+.25);
 const b=$('bub');
 if(cur){ b.className='bub '+cur.who; b.innerHTML=`<small>${cur.who==='R'?'Rita':'Joana'}</small>${cur.txt}`; const k=back((t-cur.s+.15)/.35); b.style.opacity=Math.min(cl((t-cur.s+.15)/.2),cl((cur.e+.25-t)/.2));
   b.style.transform=`scale(${.8+.2*k})`;
   if(cur.who==='R'){b.style.left='60px';b.style.right='';b.style.top=cur.scr?'1330px':'560px';b.style.transformOrigin='20% 100%';}
   else {b.style.left='';b.style.right='60px';b.style.top=cur.scr?'1330px':'560px';b.style.transformOrigin='80% 100%';}
 } else b.style.opacity=0;
 // celular da Joana em close quando mostra algo
 const sh=TL.find(l=>l.scr&&t>=l.s-.2&&t<l.e+.35);
 const ph=$('ph'); if(sh){ if(ph.dataset.s!==sh.scr){$('phs').innerHTML=SCR[sh.scr]; ph.dataset.s=sh.scr;} const k=back((t-sh.s+.2)/.5); ph.style.opacity=Math.min(cl((t-sh.s+.2)/.25),cl((sh.e+.35-t)/.25)); ph.style.transform=`translateY(${(1-k)*400}px) rotate(${(1-k)*10}deg) scale(.82)`; $('ttl').textContent=TIT[sh.scr]; $('ttl').style.opacity=ph.style.opacity; $('phs').firstElementChild&&($('phs').firstElementChild.style.transform=`translateY(${-Math.max(0,t-sh.s-1.2)*(sh.scr==='MC'?40:18)}px)`);} else {ph.style.opacity=0; $('ttl').style.opacity=0;}
 // personagens
 const rT=cur&&cur.who==='R'&&t>=cur.s&&t<cur.e, jT=cur&&cur.who==='J'&&t>=cur.s&&t<cur.e;
 const ta=x=>Math.abs(Math.sin(t*13+x))*.9;
 const iR=TL.indexOf(cur);
 pose('pr',{aL: iR===0? -150+Math.sin(t*3)*10 : (iR===9?-30:20), aR: iR===11? -160+Math.sin(t*6)*12 : (iR===6? -140 : -20), head:-6+(rT?Math.sin(t*4)*3:0), lean:iR===9?-4:0, blink:blinkAt(t), smile:iR===0?-0.5:(iR===9?-0.2:0.8), talk:rT?ta(0):0});
 pose('pj',{aL: jT&&!sh? 30+Math.sin(t*4)*10 : 15, aR: sh? -150 : (iR===12? -160+Math.sin(t*6)*14 : -40), head:6+(jT?Math.sin(t*4+1)*3:0), blink:blinkAt(t,1.1), smile:1, talk:jT?ta(1):0});
 $('sun').setAttribute('cy',900+40*t/TOTAL);
 const e=$('end'); const ln=t-END_AT; e.style.opacity=ease(ln/.6);
 if(ln>0){ $('tagE').style.transform=`scale(${back(ln/.7)}) rotate(${(1-ease(ln/.8))*-30}deg)`; $('wE').style.opacity=ease((ln-.5)/.6); $('tE').style.opacity=ease((ln-1.3)/.6); $('cE').style.opacity=ease((ln-2.1)/.5); $('cE').style.transform=`scale(${back((ln-2.1)/.5)})`; $('bE').style.opacity=ease((ln-2.9)/.6); }
 $('st').style.filter=`brightness(${1-cl(1-t/.4)})`;
}
window.render=render; render(0);
</script></body></html>

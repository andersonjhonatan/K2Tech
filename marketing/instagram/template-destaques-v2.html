<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
/* Instagram mostra só o círculo central da capa: tudo importante fica dentro dele */
.c{position:relative;width:1080px;height:1920px;background:#0B0B0C;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,#1a2f6e 0%,#0B0B0C 60%)}
.disc{position:relative;width:860px;height:860px;border-radius:50%;background:linear-gradient(145deg,#3B82F6 0%,#2563EB 45%,#1E3A8A 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px #0B0B0C,0 0 0 22px #C8A96A,0 0 120px 30px rgba(37,99,235,.35)}
.disc svg{width:440px;height:440px;stroke:#F5F5F7;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shine{position:absolute;top:70px;left:150px;width:420px;height:200px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
</style></head><body>
<div class="c" id="servicos"><div class="glow"></div><div class="disc"><div class="shine"></div><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M9.5 8l-2 2 2 2M14.5 8l2 2-2 2"/></svg></div></div>

<div class="c" id="orcamento"><div class="glow"></div><div class="disc"><div class="shine"></div><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg></div></div>

</body></html>
